name: 监控 RAICOM 安徽成绩更新
on:
  schedule:
    # 每 10 分钟运行一次
    - cron: "*/10 * * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 安装依赖
        run: |
          pip install requests

      - name: 检查更新
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python raicom_monitor.py --once

      - name: 保存状态文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update monitor state"
          file_pattern: "*.json"
 
